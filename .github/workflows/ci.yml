name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Core tests (no dependencies)
        run: |
          pip install -e .
          python -m unittest discover -s tests -v
      - name: Coverage with charts
        run: |
          pip install -e '.[dev]'
          coverage run --source=src/milpa -m unittest discover -s tests
          coverage report -m
      - name: Outputs are reproducible
        run: |
          milpa build-outputs --no-charts
          git diff --exit-code -- outputs ':!outputs/charts'
